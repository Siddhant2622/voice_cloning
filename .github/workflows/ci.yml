name: "CI — Tests & Verification"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Run Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: "Fetch model from Google Drive"
        run: |
          python data/download_from_drive.py --target models

      - name: "Run pytest test suite"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: "Verify detector initialization & model"
        run: |
          python -c "
          from src.models.cm_classifier import build_cm_classifier
          import torch
          m = build_cm_classifier(use_mamba=False)
          sd = torch.load('models/cm_detect2b_v3.pt', map_location='cpu', weights_only=False)
          m.load_state_dict(sd)
          print('[OK] Hardened DETECT-2B v3 model verified successfully!')
          "
